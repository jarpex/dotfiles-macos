set -g mode-keys vi
set -g mouse on

# ==========================================
# Vesper Theme Config for Tmux
# ==========================================

# truecolor
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Bar settings
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#101010,fg=#ffffff"

# Side sizes
set -g status-left-length 50
set -g status-right-length 150

# Left side
set -g status-left "#[fg=#101010,bg=#ecaad6,bold] #S #[fg=#ecaad6,bg=#101010,nobold]│"

# tabs
setw -g window-status-format "#[fg=#7e7e7e,bg=#101010] #I:#W "

# Active tab
setw -g window-status-current-format "#[fg=#ea83a5,bg=#101010,bold] #I:#W* #[fg=#7e7e7e,bg=#101010,nobold]"

# Separator
setw -g window-status-separator "#[fg=#7e7e7e]│"

# Right side
set -g status-right "#{?client_prefix,#[fg=#e6b99d]• ,}#[fg=#e6b99d]%a %b %e #[fg=#ffffff]/ #[fg=#aca1cf]%I:%M %p #[fg=#ffffff]/ #[fg=#99ffe4]Batt: #(pmset -g batt | grep -o '[0-9]*%%') "

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down
bind-key -n C-k send-keys C-l \; clear-history
